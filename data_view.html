
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RPS Data View</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(0,255,136,0.08),
                    transparent 35%
                ),
                #020504;

            color: #d9ffe9;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            height: 90px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 45px;

            border-bottom:
                1px solid
                rgba(0,255,136,0.18);

        }


        .title {

            font-size: 23px;

            letter-spacing: 5px;

        }


        .title span {

            color: #00ff88;

            text-shadow:
                0 0 12px
                rgba(0,255,136,0.7);

        }


        .back {

            border:
                1px solid
                rgba(0,255,136,0.3);

            background:
                rgba(0,255,136,0.03);

            color: #69e99d;

            padding: 10px 20px;

            cursor: pointer;

            letter-spacing: 2px;

            font-size: 10px;

            transition: 0.3s;

        }


        .back:hover {

            border-color: #00ff88;

            color: #00ff88;

            box-shadow:
                0 0 20px
                rgba(0,255,136,0.12);

        }


        /* =========================================
           MAIN
        ========================================= */

        .dashboard {

            padding: 30px 45px;

        }


        /* =========================================
           STAT CARDS
        ========================================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 25px;

        }


        .stat {

            min-height: 115px;

            border:
                1px solid
                rgba(0,255,136,0.2);

            background:
                rgba(0,255,136,0.025);

            padding: 22px;

            position: relative;

        }


        .stat::before {

            content: "";

            position: absolute;

            left: 0;

            top: 0;

            width: 3px;

            height: 100%;

            background: #00ff88;

            box-shadow:
                0 0 12px
                rgba(0,255,136,0.5);

        }


        .stat-label {

            font-size: 10px;

            letter-spacing: 3px;

            color: #58c88b;

            margin-bottom: 12px;

        }


        .stat-value {

            font-size: 31px;

            font-weight: 600;

            color: #d9ffe9;

        }


        .stat-value span {

            font-size: 13px;

            color: #4cd88c;

        }


        /* =========================================
           SECTION
        ========================================= */

        .section {

            border:
                1px solid
                rgba(0,255,136,0.18);

            background:
                rgba(0,255,136,0.018);

            margin-bottom: 25px;

            padding: 22px;

        }


        .section-title {

            font-size: 12px;

            letter-spacing: 3px;

            color: #52dc8b;

            margin-bottom: 20px;

        }


        /* =========================================
           CHART AREA
        ========================================= */

        .charts {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;

            margin-bottom: 25px;

        }


        .chart {

            min-height: 300px;

            position: relative;

        }


        canvas {

            width: 100% !important;

            height: 250px !important;

        }


        /* =========================================
           TABLE
        ========================================= */

        .table-container {

            max-height: 360px;

            overflow-y: auto;

            border:
                1px solid
                rgba(0,255,136,0.1);

        }


        table {

            width: 100%;

            border-collapse: collapse;

        }


        th {

            position: sticky;

            top: 0;

            background: #06110b;

            color: #5ce095;

            font-size: 10px;

            letter-spacing: 2px;

            padding: 13px;

            text-align: center;

        }


        td {

            padding: 11px;

            text-align: center;

            font-size: 12px;

            color: #b8e8ca;

            border-top:
                1px solid
                rgba(0,255,136,0.08);

        }


        tr:hover td {

            background:
                rgba(0,255,136,0.035);

            color: #e0ffec;

        }


        .win {

            color: #00ff88;

        }


        .lose {

            color: #ff6677;

        }


        .draw {

            color: #d0d0d0;

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media(max-width: 900px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);

            }

            .charts {

                grid-template-columns:
                    1fr;

            }

            .dashboard {

                padding: 25px;

            }

        }


        @media(max-width: 550px) {

            .stats {

                grid-template-columns:
                    1fr;

            }

            .header {

                padding: 0 20px;

            }

            .title {

                font-size: 17px;

            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================== -->

<header class="header">


    <div class="title">

        BAYESIAN
        <span>RPS</span>
        / DATA

    </div>


    <button
        class="back"
        onclick="goHome()"
    >

        ← GAME

    </button>


</header>


<!-- =========================================
     DASHBOARD
========================================== -->

<main class="dashboard">


    <!-- =====================================
         STATISTICS
    ====================================== -->

    <div class="stats">


        <div class="stat">

            <div class="stat-label">
                TOTAL ROUNDS
            </div>

            <div
                class="stat-value"
                id="rounds"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                MODEL ACCURACY
            </div>

            <div
                class="stat-value"
                id="accuracy"
            >
                0<span>%</span>
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                SCORE
            </div>

            <div
                class="stat-value"
                id="score"
            >
                0 : 0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                PREDICTIONS
            </div>

            <div
                class="stat-value"
                id="predictions"
            >
                0
            </div>

        </div>


    </div>


    <!-- =====================================
         CHARTS
    ====================================== -->

    <div class="charts">


        <!-- MOVE DISTRIBUTION -->

        <section class="section chart">

            <div class="section-title">

                YOUR MOVE PATTERN

            </div>

            <canvas id="moveChart"></canvas>

        </section>


        <!-- ROUND PATTERN -->

        <section class="section chart">

            <div class="section-title">

                MOVE PATTERN OVER ROUNDS

            </div>

            <canvas id="roundChart"></canvas>

        </section>


    </div>


    <!-- =====================================
         GAME DATA TABLE
    ====================================== -->

    <section class="section">


        <div class="section-title">

            CURRENT GAME DATA

        </div>


        <div class="table-container">


            <table>


                <thead>

                    <tr>

                        <th>
                            ROUND
                        </th>

                        <th>
                            YOUR MOVE
                        </th>

                        <th>
                            AI MOVE
                        </th>

                        <th>
                            RESULT
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="gameTable"
                >

                </tbody>


            </table>


        </div>


    </section>


</main>


<!-- Chart.js -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script>


    let moveChart;
    let roundChart;


    /* =========================================
       LOAD DATA
    ========================================= */

    async function loadData() {

        try {

            const response =
                await fetch("/data");


            const data =
                await response.json();


            updateStatistics(data);

            updateTable(data.history);

            updateCharts(data.history);

        }

        catch (error) {

            console.error(
                "Could not load data:",
                error
            );

        }

    }


    /* =========================================
       STATISTICS
    ========================================= */

    function updateStatistics(data) {

        document.getElementById(
            "rounds"
        ).textContent =
            data.round;


        document.getElementById(
            "accuracy"
        ).innerHTML =
            data.accuracy.toFixed(1)
            + "<span>%</span>";


        document.getElementById(
            "score"
        ).textContent =
            data.player_score
            + " : "
            + data.ai_score;


        document.getElementById(
            "predictions"
        ).textContent =
            data.total_predictions;

    }


    /* =========================================
       TABLE
    ========================================= */

    function updateTable(history) {

        const table =
            document.getElementById(
                "gameTable"
            );


        table.innerHTML = "";


        /*
            Show newest game first
        */

        [...history]
            .reverse()
            .forEach(game => {


                const row =
                    document.createElement(
                        "tr"
                    );


                const resultClass =
                    game.result;


                row.innerHTML = `

                    <td>
                        ${game.round}
                    </td>

                    <td>
                        ${game.player.toUpperCase()}
                    </td>

                    <td>
                        ${game.computer.toUpperCase()}
                    </td>

                    <td class="${resultClass}">
                        ${game.result.toUpperCase()}
                    </td>

                `;


                table.appendChild(row);

            });

    }


    /* =========================================
       CHARTS
    ========================================= */

    function updateCharts(history) {


        /* -------------------------------------
           MOVE COUNTS
        ------------------------------------- */

        let rock = 0;

        let paper = 0;

        let scissors = 0;


        history.forEach(game => {

            if (game.player === "rock")
                rock++;

            if (game.player === "paper")
                paper++;

            if (game.player === "scissors")
                scissors++;

        });


        if (moveChart) {

            moveChart.destroy();

        }


        moveChart =
            new Chart(

                document.getElementById(
                    "moveChart"
                ),

                {

                    type: "bar",

                    data: {

                        labels: [
                            "ROCK",
                            "PAPER",
                            "SCISSORS"
                        ],

                        datasets: [

                            {

                                label:
                                    "Your moves",

                                data: [
                                    rock,
                                    paper,
                                    scissors
                                ]

                            }

                        ]

                    },

                    options: {

                        responsive: true,

                        maintainAspectRatio: false,

                        plugins: {

                            legend: {
                                display: false
                            }

                        },

                        scales: {

                            y: {

                                beginAtZero: true,

                                ticks: {

                                    color:
                                        "#70d99b",

                                    precision: 0

                                },

                                grid: {

                                    color:
                                        "rgba(0,255,136,0.08)"

                                }

                            },

                            x: {

                                ticks: {

                                    color:
                                        "#70d99b"

                                },

                                grid: {

                                    color:
                                        "rgba(0,255,136,0.04)"

                                }

                            }

                        }

                    }

                }

            );


        /* -------------------------------------
           ROUND PATTERN
        ------------------------------------- */

        const labels =
            history.map(
                game => "R" + game.round
            );


        const rockData =
            history.map(
                game =>
                    game.player === "rock"
                    ? 1
                    : 0
            );


        const paperData =
            history.map(
                game =>
                    game.player === "paper"
                    ? 1
                    : 0
            );


        const scissorsData =
            history.map(
                game =>
                    game.player === "scissors"
                    ? 1
                    : 0
            );


        if (roundChart) {

            roundChart.destroy();

        }


        roundChart =
            new Chart(

                document.getElementById(
                    "roundChart"
                ),

                {

                    type: "line",

                    data: {

                        labels: labels,

                        datasets: [

                            {

                                label: "Rock",

                                data: rockData,

                                tension: 0.3

                            },

                            {

                                label: "Paper",

                                data: paperData,

                                tension: 0.3

                            },

                            {

                                label: "Scissors",

                                data: scissorsData,

                                tension: 0.3

                            }

                        ]

                    },

                    options: {

                        responsive: true,

                        maintainAspectRatio: false,

                        scales: {

                            y: {

                                min: 0,

                                max: 1,

                                ticks: {

                                    color:
                                        "#70d99b",

                                    stepSize: 1

                                },

                                grid: {

                                    color:
                                        "rgba(0,255,136,0.08)"

                                }

                            },

                            x: {

                                ticks: {

                                    color:
                                        "#70d99b"

                                },

                                grid: {

                                    color:
                                        "rgba(0,255,136,0.04)"

                                }

                            }

                        },

                        plugins: {

                            legend: {

                                labels: {

                                    color:
                                        "#8ce5af"

                                }

                            }

                        }

                    }

                }

            );

    }


    /* =========================================
       GO HOME
    ========================================= */

    function goHome() {

        window.location.href = "/";

    }


    /* =========================================
       INITIAL LOAD
    ========================================= */

    loadData();


    /*
        Automatically refresh data every
        2 seconds so the dashboard reflects
        the current game.
    */

    setInterval(
        loadData,
        2000
    );


</script>


</body>

</html>
